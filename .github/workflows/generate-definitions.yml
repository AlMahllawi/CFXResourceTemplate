name: Generate Definitions

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  definitions:
    uses: AlMahllawi/cfx-lua-definitions/.github/workflows/generate.yml@v1.0.0
    permissions:
      contents: write
    with:
      resource-path: '.'
      output-path: './definitions'
      resource-name: 'ResourceTemplate'
      commit-changes: true